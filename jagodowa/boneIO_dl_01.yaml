substitutions:
  name: boneio-dr-8ch-03-7d86e0
  friendly_name: 'BoneIO Dimmer LED 7d86e0'
  serial_prefix: 'dim' #Don't change it.

esphome:
  name: '${name}'
  friendly_name: '${friendly_name}'
  name_add_mac_suffix: false
  project:
    name: boneio.dimmer-led
    version: '0.3'

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://boneIO-eu/esphome-LM75@main #Original source and thank you note for BTomala https://github.com/boneIO-eu/esphome-lm75
    components: [lm75]

packages:
  internals_packages:
    url: https://github.com/boneIO-eu/esphome
    ref: v1.7.1
    files:
      [
        'devices/serial_no.yaml',
        'devices/dimmer_i2c.yaml',
        'devices/dimmer_ina219.yaml',
        'boards/dimmer_output.yaml',
      ]

ethernet:
  id: eth
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16

udp:

packet_transport:
  - id: transport
    platform: udp
    update_interval: 5s
    providers:
      - name: boneio-32-l-07-39d104
        encryption: 'JAG_BONEIO1_KEY' #set it to yours shared secret key

dashboard_import:
  package_import_url: github://boneIO-eu/esphome/boneio-dimmer_8ch-v0_3.yaml@latest
  import_full_config: true

pcf8574:
  - id: 'pcf_inputs'
    address: 0x38

logger:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80
  local: true
  version: 3

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Warsaw
    servers:
      - ntp1.tp.pl
      - ntp2.tp.pl

text_sensor:
  - platform: version
    name: 'boneio-dimmer- Version'
    icon: mdi:cube-outline
    entity_category: diagnostic
  - platform: ethernet_info
    ip_address:
      entity_category: diagnostic
      name: boneio-dimmer IP
  - platform: template
    name: 'Hostname'
    id: hostname
    entity_category: diagnostic
    lambda: |-
      return id(eth).get_use_address();
    update_interval: 5min

script:
  - id: przedpokoj
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("przedpokoj", "%s %s", sn.c_str(), pt.c_str());
          id(L09A).toggle().perform();
          id(L09B).toggle().perform();
          id(L10A).toggle().perform();
          id(L10B).toggle().perform();
  ###### GABINET #####
  - id: gabinet
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("gabinet", "%s %s", sn.c_str(), pt.c_str());
          
          // L11 -> led polka
          // L12 -> led Blenda
          
          if ((sn == "S12_P" && pt == "LP") || pt == "VLP") {
            id(L11).turn_off().perform();
            id(L12).turn_off().perform();
          }
          
          if (sn == "S12_P" && pt == "SP") {
            auto isOnL11 = id(L11).current_values.is_on();
            auto isOnL12 = id(L12).current_values.is_on();
            if ((!isOnL11 && !isOnL12) || (isOnL11 && isOnL12)) {
              id(L12).turn_on().perform();
              id(L11).turn_off().perform();
            }
          
            if (isOnL12 && !isOnL11) {
              id(L12).turn_off().perform();
              id(L11).turn_on().perform();
            }
          
            if (!isOnL12 && isOnL11) {
              id(L12).turn_on().perform();
              id(L11).turn_on().perform();
            }
          }
###### GABINET #####
###### SYPIALNIA #####
  - id: sypialnia
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("sypialnia", "%s %s", sn.c_str(), pt.c_str());

###### SYPIALNIA #####

binary_sensor:
######### PRZEDPOKOJ #######################################
  - platform: packet_transport
    transport_id: transport
    provider: boneio-32-l-07-39d104
    id: remote_S10
    remote_id: S10
    type: data
    on_press:
      then:
        - logger.log: "R S10 OP -> przedpokoj sypialnia/salon"
        - script.execute:
            id: przedpokoj
            sn: "S10"
            pt: "OP"
  - platform: packet_transport
    transport_id: transport
    provider: boneio-32-l-07-39d104
    id: remote_S11_P
    remote_id: S11_P
    type: data
