  - platform: monochromatic
    output: chr02
    name: 'L09B'
    id: L09B
    default_transition_length: 2s
    gamma_correct: 0
  - platform: monochromatic
    output: chr03
    name: 'L10A'
    id: L10A
    default_transition_length: 2s
