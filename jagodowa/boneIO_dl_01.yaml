    output: chl01
    name: 'L03 - Blenda sypialnia'
    id: L03
    default_transition_length: 2s
    gamma_correct: 0
  - platform: monochromatic
    output: chl02
    name: 'L04 - Lozko sypialnia'
    id: L04
    default_transition_length: 2s
    gamma_correct: 0
  - platform: monochromatic
    output: chl03
    name: 'L11 - Gabinet polka'
    id: L11
    default_transition_length: 2s
    gamma_correct: 0
  - platform: monochromatic
    output: chl04
    name: 'L12 - Gabinet blenda'
    id: L12
    default_transition_length: 2s
    gamma_correct: 0

  - platform: monochromatic
    output: chr01
    name: 'L09A'
    id: L09A
    default_transition_length: 2s
