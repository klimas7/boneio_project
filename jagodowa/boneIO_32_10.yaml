  - platform: gpio
    name: 'Czujnik obecnosci 1'
    id: CO_1 #IN_32
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 3
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "CO_1 OP -> czujnik obecnosci 1"
        - lambda: |-
            id(sensors_states)[0] = true;
    on_release:
      then:
        - logger.log: "CO_1 OR -> czujnik obecnosci 1"
        - lambda: |-
            id(sensors_states)[0] = false;

  - platform: gpio
    name: 'Czujnik obecnosci 2'
    id: CO_2 #IN_33
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 4
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "CO_2 OP -> czujnik obecnosci 2"
        - lambda: |-
            id(sensors_states)[1] = true;
    on_release:
      then:
        - logger.log: "CO_2 OR -> czujnik obecnosci 2"
        - lambda: |-
            id(sensors_states)[1] = false;

  - platform: gpio
    name: 'Czujnik zmierzchowy'
    id: CZ #IN_34
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 5
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "CZ OP -> czujnik zmierzchu"
        - script.execute: on_boot_time_check
        - lambda: |-
            id(sensors_states)[2] = true;
            auto time = id(ds1307_time).now();
            if (time.is_valid()) {
              char buffer[9];
              sprintf(buffer, "%02d:%02d:%02d", time.hour, time.minute, time.second);
              id(cz_last_on).publish_state(buffer);
            }
    on_release:
      then:
        - logger.log: "CZ OR -> czujnik zmierzchu"
        - light.turn_off: O04
        - light.turn_off: O11
        - lambda: |-
            id(sensors_states)[2] = false;
            auto time = id(ds1307_time).now();
            if (time.is_valid()) {
              char buffer[9];
              sprintf(buffer, "%02d:%02d:%02d", time.hour, time.minute, time.second);
              id(cz_last_off).publish_state(buffer);
            }

  - platform: gpio
    name: 'IN_35'
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 6
      mode:
        input: true
      inverted: true
  - platform: packet_transport
    transport_id: transport
    provider: boneio-dr-8ch-03-7c8500
    id: remote_LED_STATE
    remote_id: LED_STATE
    type: data
    on_state_change:
      then:
        - lambda: |-
            auto ledState = x.has_value() ? ONOFF(x.value()) : "Unknown";
            ESP_LOGI("LED_STATE", "%s", ledState);
            if (ledState == "ON") {
              id(wentylator_on).execute();
            } else if (ledState == "OFF") {
              id(wentylator_off).execute();
            }

