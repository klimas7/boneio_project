binary_sensor:
  - platform: gpio
    name: S1_A
    id: in_s1_a
    pin:
      pcf8574: pcf_inputs_1to14
      number: 0
      mode:
        input: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.1s
        then:
          - script.execute:
              id: changeLightsState
              index: 0
              lightA: !lambda 'return id(light_01);'
              lightB: !lambda 'return id(light_02);'
        invalid_cooldown: 0.5s
      - timing:
          - ON for at least 0.7s
        then:
          - script.execute:
              id: offLights
              index: 0
              lightA: !lambda 'return id(light_01);'
              lightB: !lambda 'return id(light_02);'
        invalid_cooldown: 0.5s

