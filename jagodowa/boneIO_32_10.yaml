substitutions:
  name: boneio-32-l-07-73be28
  friendly_name: 'BoneIO ESP 32x10 Lights 73be28'
  serial_prefix: 'esp' #Don't change it.

esphome:
  name: '${name}'
  friendly_name: '${friendly_name}'
  name_add_mac_suffix: false
  project:
    name: boneio.32x10-lights
    version: '0.7'

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

ethernet:
  id: eth
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16

udp:

packet_transport:
  - id: transport
    platform: udp
    update_interval: 5s
    encryption: 'JAG_BONEIO1_KEY' #set it to yours shared secret key
    rolling_code_enable: true
    binary_sensors:
      - S02B_P #L01 & L02 Salon dl_02
      - S03B_P #L01 & L02 Salon dl_02
      - S05_P  #L03 & L04 Sypialnia dl_01
      - S06_PG #L03 & L04 Sypialnia dl_01
      - S06_PD #L03 & L04 Sypialnia dl_01
      - S07_LG #L03 & L04 Sypialnia dl_01
      - S07_LD #L03 & L04 Sypialnia dl_01
      - S08_P  #Lazienka  dl_02
      - S08_L  #Lazienka  dl_02
      - S09_G  #Lazienka  dl_02
      - S09_D  #Przedpokuj dl_01
      - S10    #Przedpokuj dl_01
      - S11_P  #Przedpokuj dl_01
      - S12_P  #Gabinet    dl_01
      - CO_1   #Przedpokuj dl_01
      - CO_2   #Przedpokuj dl_01
      - CZ     #All dl_01 & dl_02
    providers:
      - name: boneio-dr-8ch-03-30f8d8
        encryption: 'JAG_BONEIO2_KEY' #set it to yours shared secret key
      - name: boneio-dr-8ch-03-7c8500
        encryption: 'JAG_BONEIO3_KEY' #set it to yours shared secret key

dashboard_import:
  package_import_url: github://boneIO-eu/esphome/boneio-32x10_lights_v0_7.yaml@latest
  import_full_config: true

packages:
  internals_packages:
    url: https://github.com/boneIO-eu/esphome
    ref: v1.7.1
    files: [
      'devices/buzzer.yaml',
      'devices/serial_no.yaml',
      'devices_v0_7/display.yaml',
      'devices_v0_7/i2c.yaml',
      'devices_v0_7-v0_9/ina219.yaml',
      'devices_v0_7-v0_9/lm75b.yaml',
      'devices_v0_7-v0_9/pcf.yaml',
      'boards/output/out01_02.yaml',
      'boards/output/out03_04.yaml',
      'boards/output/out05_06.yaml',
      'boards/output/out07_08.yaml',
      'boards/output/out09_10.yaml',
      'boards/output/out11_12.yaml',
      'boards/output/out13_14.yaml',
      'boards/output/out15_16.yaml',
      'boards/output/out17_18.yaml',
      'boards/output/out19_20.yaml',
      'boards/output/out21_22.yaml',
      'boards/output/out23_24.yaml',
      'boards/output/out25_26.yaml',
      'boards/output/out27_28.yaml',
      'boards/output/out29_30.yaml',
      'boards/output/out31_32.yaml',
      # 'devices_v0_7-v0_9/one_wire.yaml',
    ]

logger:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80
  local: true
  version: 3

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Warsaw
    servers:
      - ntp1.tp.pl
      - ntp2.tp.pl
    on_time:
      seconds: 0
      minutes: 0
      hours: 23
      then:
        - logger.log: "Godzina 23:00"
        - light.turn_off: O01_A

script:
  - id: salon
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("salon", "%s %s", sn.c_str(), pt.c_str());
          id(O01_A).toggle().perform();
          id(O02_A).toggle().perform();
          id(O03_A).toggle().perform();

  - id: sypialnia
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("sypialnia", "%s %s", sn.c_str(), pt.c_str());
          id(O08).toggle().perform();

  - id: gabinet
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("gabinet", "%s %s", sn.c_str(), pt.c_str());
          id(O10).toggle().perform();

  - id: przedpokuj
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("przedpokuj", "%s %s", sn.c_str(), pt.c_str());

  - id: lazienka
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("lazienka", "%s %s", sn.c_str(), pt.c_str());
          id(O09).toggle().perform();

light:
  - platform: binary
    name: 'Salon/Wypoczynek A'
    output: out_01
    id: O01_A
  - platform: binary
    name: 'Salon/Wypoczynek B'
    output: out_02
    id: O01_B
  - platform: binary
    name: 'Salon/Jadalnia A'
    output: out_03
    id: O02_A
  - platform: binary
    name: 'Salon/Jadalnia B'
    output: out_04
    id: O02_B
  - platform: binary
    name: 'Salon/Kuchnia A'
    output: out_05
    id: O03_A
  - platform: binary
    name: 'Salon/Kuchnia B'
    output: out_06
    id: O03_B
  - platform: binary
    name: 'Oswietlenie elewacja pole'
    output: out_07
    id: O04
  - platform: binary
    name: 'Oswietlenie podbitka'
    output: out_08
    id: O05
  - platform: binary
    name: 'Gniazdo zewnetrzne podbitka pole'
    output: out_09
    id: GZ01
  - platform: binary
    name: '_nieuzywane_01'
    output: out_10
    id: dont_use_01
  - platform: binary
    name: 'Sypialnia lozko prawa'
    output: out_11
    id: O07
  - platform: binary
    name: 'Sypialnia lozko lewa'
    output: out_12
    id: O06
  - platform: binary
    name: 'Sypialnia glowne'
    output: out_13
    id: O08
  - platform: binary
    name: 'Lazienka glowne'
