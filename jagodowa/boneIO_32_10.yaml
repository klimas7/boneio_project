binary_sensor:
  - platform: gpio
    name: 'Salon przy oknie tarasowym - Prawa'
    id: S01_P
    pin:
      pcf8574: pcf_inputs_1to14
      number: 0
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S01_P OP -> Okno tarasowym - Prawa"

  - platform: gpio
    name: 'Salon przy oknie tarasowym - Lewa'
    id: S01_L
    pin:
      pcf8574: pcf_inputs_1to14
      number: 1
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S01_L OP -> Okno tarasowym - Prawa"

  - platform: gpio
    name: 'Salon przy wyspie A - Prawa'
    id: S02A_P
    pin:
      pcf8574: pcf_inputs_1to14
      number: 2
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S02A_P OP -> Przy wyspie A prawy"
        - script.execute:
            id: salon
            sn: "S02A_P"
            pt: "OP"

  - platform: gpio
    name: 'Salon przy wyspie A - Lewa'
    id: S02A_L
    pin:
      pcf8574: pcf_inputs_1to14
      number: 3
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S02A_L OP -> Przy wyspie A lewa"

  - platform: gpio
    name: 'Salon przy wyspie B - Prawa'
    id: S02B_P
    pin:
      pcf8574: pcf_inputs_1to14
      number: 4
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S02B_P OP -> Przy wyspie B prawa"

  - platform: gpio
    name: 'Salon przy wyspie B - Lewa'
    id: S02B_L
    pin:
      pcf8574: pcf_inputs_1to14
      number: 5
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S02B_L OP -> Przy wyspie B lewa"

  - platform: gpio
    name: 'Salon przy wejsciu A - Prawa'
    id: S03A_P
    pin:
      pcf8574: pcf_inputs_1to14
      number: 6
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S03A_P OP -> Przy wejsciu A prawy"
        - script.execute:
            id: salon
            sn: "S03A_P"
            pt: "OP"

  - platform: gpio
    name: 'Salon przy wejsciu A - Lewa'
    id: S03A_L
    pin:
      pcf8574: pcf_inputs_1to14
      number: 8
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S03A_L OP -> Przy wejsciu A lewa"

  - platform: gpio
    name: 'Salon przy wejsciu B - Prawa'
    id: S03B_P
    pin:
      pcf8574: pcf_inputs_1to14
      number: 9
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S03B_P OP -> Przy wejsciu B prawy"

  - platform: gpio
    name: 'Salon przy wejsciu B - Lewa'
    id: S03B_L
    pin:
      pcf8574: pcf_inputs_1to14
      number: 10
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S03B_P OP -> Przy wejsciu B lewa"

  - platform: gpio
    name: 'Sypialnia przy oknie tarasowym - Prawa'
    id: S04_P
    pin:
      pcf8574: pcf_inputs_1to14
      number: 11
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S04_P OP -> okno tarasowe prawa"

  - platform: gpio
    name: 'Sypialnia przy oknie tarasowym - Lewa'
    id: S04_L
    pin:
      pcf8574: pcf_inputs_1to14
      number: 12
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S04_L OP -> okno tarasowe lewa"

  - platform: gpio
    name: 'Sypialnia przy wejsciu - Prawa'
    id: S05_P
    pin:
      pcf8574: pcf_inputs_1to14
      number: 13
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S05_P OP -> Przy wejsciu - prawa"

  - platform: gpio
    name: 'Sypialnia przy wejsciu - Lewa'
    id: S05_L
    pin:
      pcf8574: pcf_inputs_1to14
      number: 14
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S05_L OP -> Przy wejsciu lewa"
        - script.execute:
            id: sypialnia
            sn: "S05_L"
            pt: "OP"

  - platform: gpio
    name: 'Sypialnia przy lozku po prawej - Prawa Dol'
    id: S06_PD
    pin:
      pcf8574: pcf_inputs_15to28
      number: 6
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S06_PD OP -> prawa prawa dol"

  - platform: gpio
    name: 'Sypialnia przy lozku po prawej - Prawa Gora'
    id: S06_PG
    pin:
      pcf8574: pcf_inputs_15to28
      number: 5
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S06_PG OP -> prawa prawa gora"

  - platform: gpio
    name: 'Sypialnia przy łużku po prawej - Lewa Dol'
    id: S06_LD
    pin:
      pcf8574: pcf_inputs_15to28
      number: 4
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S06_LD OP -> prawa lewa dol"

  - platform: gpio
    name: 'Sypialnia przy łużku po prawej - Lewa Gora'
    id: S06_LG
    pin:
      pcf8574: pcf_inputs_15to28
      number: 3
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S06_LG OP -> prawa lewa gora"

  - platform: gpio
    name: 'Sypialnia przy łużku po lewej - Prawa Dol'
    id: S07_PD
    pin:
      pcf8574: pcf_inputs_15to28
      number: 2
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S07_PD OP -> lewa prawa dol"

  - platform: gpio
    name: 'Sypialnia przy łużku po lewej - Prawa Gora'
    id: S07_PG
    pin:
      pcf8574: pcf_inputs_15to28
      number: 1
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S07_PG OP -> lewa prawa gora"

  - platform: gpio
    name: 'Sypialnia przy łużku po lewej - Lewa Dol'
    id: S07_LD
    pin:
      pcf8574: pcf_inputs_15to28
      number: 0
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S07_LD OP -> lewa lewa dol"

  - platform: gpio
    name: 'Sypialnia przy łużku po lewej - Lewa Gora'
    id: S07_LG
    pin:
      pcf8574: pcf_inputs_15to28
      number: 8
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S07_LG OP -> lewa lewa gora"

  - platform: gpio
    name: 'Lazienka przy lustrze - Prawa'
    id: S08_P
    pin:
      pcf8574: pcf_inputs_15to28
      number: 9
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S08_P OP -> lustro prawa"

  - platform: gpio
    name: 'Lazienka przy lustrze - Lewa'
    id: S08_L
    pin:
      pcf8574: pcf_inputs_15to28
      number: 10
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S08_L OP -> lustro lewa"

  - platform: gpio
    name: 'Wejscie do lazienki - Gora'
    id: S09_G
    pin:
      pcf8574: pcf_inputs_15to28
      number: 11
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S09_G OP -> Wejscie gora"
        - script.execute:
            id: lazienka
            sn: "S09_L"
            pt: "OP"

  - platform: gpio
    name: 'Wejscie do lazienki - Dol'
    id: S09_D
    pin:
      pcf8574: pcf_inputs_15to28
      number: 12
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S09_D OP -> Wejscie dol"

  - platform: gpio
    name: 'Przedpokuj wejscie do sypialni/salonu'
    id: S10
    pin:
      pcf8574: pcf_inputs_15to28
      number: 13
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S10 OP -> przedpokoj sypialnia/salon"

  - platform: gpio
    name: 'Przedpokuj wejscie do domu - Prawa'
    id: S11_P
    pin:
      pcf8574: pcf_inputs_15to28
      number: 14
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S11_P OP -> przedpokoj wejscie prawa"

  - platform: gpio
    name: 'Przedpokuj wejscie do domu - Lewa'
    id: S11_L
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 0
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S11_L OP -> przedpokoj wejscie lewa"

  - platform: gpio
    name: 'Gabinet - Prawa'
    id: S12_P
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 1
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S12_P OP -> gabinet prawa"

  - platform: gpio
    name: 'Gabinet - Lewa'
    id: S12_L
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 2
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "S12_L OP -> gabinet Lewa"
        - script.execute:
            id: gabinet
            sn: "S12_L"
            pt: "OP"

  - platform: gpio
    name: 'Czujnik obecnosci 1'
    id: CO_1
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 3
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "CO_1 OP -> czujnik obecnosci 1"

  - platform: gpio
    name: 'Czujnik obecnosci 2'
    id: CO_2
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 4
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - logger.log: "CO_2 OP -> czujnik obecnosci 2"

  - platform: gpio
    name: 'Czujnik zmierzchowy'
    id: CZ #IN_34
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 5
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on:
          seconds: 30
    on_press:
      then:
        - logger.log: "CZ OP -> czujnik zmierzchu"
        - if:
            condition:
              lambda: |-
                ESP_LOGI("in condition", "%s", "_1_");
                auto t = id(sntp_time).now();
                if (!t.is_valid()) {
                  ESP_LOGI("in condition", "%s", "_2_");
                  return false;
                }
                int h = t.hour;
                int m = t.minute;
                ESP_LOGI("in condition", "%s %d %d", "_3_", h, m);
                return (h >= 15 && h < 23);
            then:
              - light.turn_on: O01_A
    on_release:
      then:
        - logger.log: "CZ OR -> czujnik zmierzchu"
        - light.turn_off: O01_A

  - platform: gpio
    name: 'IN_35'
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 6
      mode:
        input: true
      inverted: true
