######################
### MODBUS SECTION ###
######################
# UNCOMMENT BELOW TO USE MODBUS
uart:
  id: uart_pin14_15
  rx_pin: GPIO14
  tx_pin: GPIO15
  baud_rate: 9600
  stop_bits: 1


sensor:
  - platform: dallas_temp
    address: 0x1f07237002c46028
    name: "Room 1"

  - platform: dallas_temp
    address: 0x110823a1af6e8228
    name: "Room 2"

  - platform: sdm_meter
    address: 0x01
    phase_a:
      current:
        name: "SDM120M Current"
      voltage:
        name: "SDM230M Voltage"
      active_power:
        name: "SDM230M Power"

