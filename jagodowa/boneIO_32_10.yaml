substitutions:
  name: boneio-32-l-07-39d104
  friendly_name: 'BoneIO ESP 32x10 Lights 39d104'
  serial_prefix: 'esp' #Don't change it.

esphome:
  name: '${name}'
  friendly_name: '${friendly_name}'
  name_add_mac_suffix: false
  project:
    name: boneio.32x10-lights
    version: '0.7'

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

ethernet:
  id: eth
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16

udp:

packet_transport:
  - id: transport
    platform: udp
    update_interval: 5s
    encryption: 'JAG_BONEIO1_KEY' #set it to yours shared secret key
    rolling_code_enable: true
    binary_sensors:
      - S02B_P #L01 & L02 Salon dl_02
      - S03B_P #L01 & L02 Salon dl_02
      - S05_P  #L03 & L04 Sypialnia dl_01
      - S06_PG #L03 & L04 Sypialnia dl_01
      - S06_PD #L03 & L04 Sypialnia dl_01
      - S07_LG #L03 & L04 Sypialnia dl_01
      - S07_LD #L03 & L04 Sypialnia dl_01
      - S08_P  #Lazienka  dl_02
      - S08_L  #Lazienka  dl_02
      - S09_G  #Lazienka  dl_02
      - S09_D  #Przedpokoj dl_01
      - S10    #Przedpokoj dl_01
      - S11_P  #Przedpokoj dl_01
      - S12_P  #Gabinet    dl_01
      - CO_1   #Przedpokoj dl_01
      - CO_2   #Przedpokoj dl_01
      - CZ     #All dl_01 & dl_02
    providers:
      - name: boneio-dr-8ch-03-7d86e0
        encryption: 'JAG_BONEIO2_KEY' #set it to yours shared secret key
      - name: boneio-dr-8ch-03-7c8500
        encryption: 'JAG_BONEIO3_KEY' #set it to yours shared secret key

dashboard_import:
  package_import_url: github://boneIO-eu/esphome/boneio-32x10_lights_v0_7.yaml@latest
  import_full_config: true

packages:
  internals_packages_boneIO_eu:
    url: https://github.com/boneIO-eu/esphome
    ref: v1.7.1
    files: [
      'devices/buzzer.yaml',
      'devices/serial_no.yaml',
      'devices_v0_7/i2c.yaml',
      'devices_v0_7-v0_9/ina219.yaml',
      'devices_v0_7-v0_9/lm75b.yaml',
      'devices_v0_7-v0_9/pcf.yaml',
      'boards/output/out01_02.yaml',
      'boards/output/out03_04.yaml',
      'boards/output/out05_06.yaml',
      'boards/output/out07_08.yaml',
      'boards/output/out09_10.yaml',
      'boards/output/out11_12.yaml',
      'boards/output/out13_14.yaml',
      'boards/output/out15_16.yaml',
      'boards/output/out17_18.yaml',
      'boards/output/out19_20.yaml',
      'boards/output/out21_22.yaml',
      'boards/output/out23_24.yaml',
      'boards/output/out25_26.yaml',
      'boards/output/out27_28.yaml',
      'boards/output/out29_30.yaml',
      'boards/output/out31_32.yaml',
    ]
  internals_packages_klimas7:
    url: https://github.com/klimas7/esphome
    ref: v1.8.10
    files: [ time.yaml, display.yaml ]

logger:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
  - platform: web_server

safe_mode:
  disabled: true

web_server:
  port: 80
  local: true
  version: 3

time:
  - id: !extend ds1307_time
    on_time:
      seconds: 0
      minutes: 0
      hours: 22
      then:
        - logger.log: "Godzina 22:00"
        - light.turn_off: O04
        - light.turn_off: O11

script:
  - id: !extend on_boot_time_check
    then:
      - lambda: |-
          ESP_LOGI("extended_on_boot_time_check", "%s", "_1_");
          auto time = id(ds1307_time).now();
          if (!time.is_valid()) {
            ESP_LOGI("extended_on_boot_time_check", "%s", "zegar jest nie synchronizowany");
            if (id(CZ).state) {
              id(O04).turn_on().perform();
              id(O11).turn_on().perform();
              ESP_LOGI("extended_on_boot_time_check", "%s", "light on mimo niesynchronizowania zegara");
            }
            return;
          }
          
          int h = time.hour;
          int m = time.minute;
          ESP_LOGI("extended_on_boot_time_check", "%s %d %d", "_3_", h, m);
          if (h >= 12 && h < 22 && id(CZ).state) {
            id(O04).turn_on().perform();
            id(O11).turn_on().perform();
            ESP_LOGI("extended_on_boot_time_check", "%s", "light on");
          } else {
            ESP_LOGI("extended_on_boot_time_check", "%s", "light no change");
          }

###### SALON ##########
  - id: salon
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("salon", "%s %s", sn.c_str(), pt.c_str());
          
          if (pt == "VLP") {
            id(O01_A).turn_off().perform();
            id(O01_B).turn_off().perform();
            id(O02_A).turn_off().perform();
            id(O02_B).turn_off().perform();
            id(O03_A).turn_off().perform();
            id(O03_B).turn_off().perform();
            return;
          }
          
          auto isKuchnia = (sn == "S02A_L" || sn == "S03A_L");
          auto isJadalnia = (sn == "S02A_P" || sn == "S03A_P");
          auto isWypoczynek = (sn == "S02B_L" || sn == "S03B_L");
          
          light::LightState *lA = nullptr;
          light::LightState *lB = nullptr;
          
          if (isKuchnia) {
            lA = id(O03_A);
            lB = id(O03_B);
          } else if (isJadalnia) {
            lA = id(O02_A);
            lB = id(O02_B);
          } else if (isWypoczynek) {
            lA = id(O01_A);
            lB = id(O01_B);
          } else {
            return;
          }
          
          if (pt == "LP") {
            lA->turn_off().perform();
            lB->turn_off().perform();
          } else if (pt == "SP") {
            auto isOnA = lA->current_values.is_on();
            auto isOnB = lB->current_values.is_on();
          
            if ((!isOnA && !isOnB) || (isOnA && isOnB)) {
              lA->turn_on().perform();
              lB->turn_off().perform();
            } else if (isOnA && !isOnB) {
              lA->turn_off().perform();
              lB->turn_on().perform();
            } else if (!isOnA && isOnB) {
              lA->turn_on().perform();
              lB->turn_on().perform();
            }
          }
###### SALON ##########

###### SYPIALNIA ######
  - id: sypialnia
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("sypialnia", "%s %s", sn.c_str(), pt.c_str());
          id(O08).toggle().perform();
###### SYPIALNIA ######

###### GABINET ########
  - id: gabinet
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("gabinet", "%s %s", sn.c_str(), pt.c_str());
          
          if ((sn == "S12_L" && pt == "LP") || pt == "VLP") {
            id(O10).turn_off().perform();
          }
          
          if (sn == "S12_L" && pt == "SP") {
            id(O10).turn_on().perform();
          }
###### GABINET ########

###### PRZEDPOKOJ #####
  - id: przedpokoj
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("przedpokoj", "%s %s", sn.c_str(), pt.c_str());
###### PRZEDPOKOJ #####

###### LAZIENKA #######
  - id: lazienka
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("lazienka", "%s %s", sn.c_str(), pt.c_str());
          
          if (sn == "S09_G" && pt == "LP") {
            id(O09).turn_off().perform();
          }
          
          if (sn == "S08_P" && pt == "SP") {
            id(O09).toggle().perform();  
          }
          
          if ((sn == "S08_P" || sn == "S08_L") && pt == "LP") {
            id(O09).turn_off().perform();
          }

###### LAZIENKA #######

###### ZEWNATRZ ######
  - id: zewnatrz
    parameters:
      sn: string #switch name
      pt: string #push type
    then:
      - lambda: |-
          ESP_LOGI("zewnatrz", "%s %s", sn.c_str(), pt.c_str());
          
          if (pt != "OP") {
            return;
          }
          
          if (sn == "S01_P" || sn == "S04_P") {
            auto isOnGZ = id(GZ01).current_values.is_on() || id(GZ02).current_values.is_on() || id(GZ03).current_values.is_on();
            if (isOnGZ) {
              id(GZ01).turn_off().perform();
              id(GZ02).turn_off().perform();
              id(GZ03).turn_off().perform();
            } else {
              id(GZ01).turn_on().perform();
              id(GZ02).turn_on().perform();
              id(GZ03).turn_on().perform();
            }
          }
          
          if (sn == "S01_L" || sn == "S04_L") {
            auto isOn = id(O04).current_values.is_on() && id(O11).current_values.is_on();
            if (!isOn) {
              id(O04).turn_on().perform();
              id(O11).turn_on().perform();
            } else {
              auto time = id(ds1307_time).now();
              int h = time.hour;
              auto shouldBeOn = (h >= 12 && h < 22 && id(CZ).state);
              if (!shouldBeOn) {
                id(O04).turn_off().perform();
                id(O11).turn_off().perform();
              }
            }
          }
###### ZEWNATRZ ######

##### WENTYLATOR #####
  - id: wentylator_on
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("wentylator", "on");
      - script.stop: wentylator_off
      - delay: 1min
      - light.turn_on: W01

  - id: wentylator_off
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("wentylator", "off");
      - delay: 2min
      - light.turn_off: W01
##### WENTYLATOR #####

