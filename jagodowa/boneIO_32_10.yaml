substitutions:
  name: boneio-32-l-07-73be28
  friendly_name: BoneIO ESP 32x10 Lights 73be28
  serial_prefix: esp   #Don't change it.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: boneio.32x10-lights
    version: '0.7'

esp32:
  board: nodemcu-32s

ethernet:
  id: eth
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_IN
  phy_addr: 1
  power_pin: GPIO16

udp:

packet_transport:
  - id: transport
    platform: udp
    update_interval: 5s
    encryption: 'BKL_BONEIO1_KEY' #set it to yours shared secret key
    rolling_code_enable: true
    binary_sensors:
      - in_s1_c
      - in_s1_d
    providers:
      - name: boneio-dr-8ch-03-30f8d8
        encryption: 'BKL_BONEIO2_KEY' #set it to yours shared secret key

dashboard_import:
  package_import_url: github://boneIO-eu/esphome/boneio-32x10_lights_v0_7.yaml@latest
  import_full_config: true

packages:
  internals_packages:
    url: https://github.com/boneIO-eu/esphome
    ref: v1.6.0
    files: [devices/buzzer.yaml, devices/serial_no.yaml, devices_v0_7/display.yaml,
            devices_v0_7/i2c.yaml, devices_v0_7-v0_9/ina219.yaml, devices_v0_7-v0_9/lm75b.yaml,
            devices_v0_7-v0_9/pcf.yaml, boards/output/out01_02.yaml, boards/output/out03_04.yaml,
            boards/output/out05_06.yaml, boards/output/out07_08.yaml, boards/output/out09_10.yaml,
            boards/output/out11_12.yaml, boards/output/out13_14.yaml, boards/output/out15_16.yaml,
            boards/output/out17_18.yaml, boards/output/out19_20.yaml, boards/output/out21_22.yaml,
            boards/output/out23_24.yaml, boards/output/out25_26.yaml, boards/output/out27_28.yaml,
            boards/output/out29_30.yaml, boards/output/out31_32.yaml]

logger:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome

web_server:
  port: 80
  local: true
  version: 3

time:
  - platform: homeassistant
    timezone: Europe/Warsaw
    id: homeassistant_time

globals:
  - id: states
    type: int[3]

script:
  - id: changeLightsState
    parameters:
      index: int
      lightA: light::LightState*
      lightB: light::LightState*
    then:
      - lambda: |-
          switch (id(states)[index]) {
              case 0: // LA(on), LB(off)  
                lightA->turn_on().perform();
                lightB->turn_off().perform();
                break;
              case 1: // LA(off), LB(on)
                lightA->turn_off().perform();
                lightB->turn_on().perform();
                break;
              case 2: // L1(on), L2(on)
                lightA->turn_on().perform();
                lightB->turn_on().perform();
                break;
            }

          id(states)[index] = (id(states)[index] + 1) % 3;
  - id: offLights
    parameters:
      index: int
      lightA: light::LightState*
      lightB: light::LightState*
    then:
      - lambda: |-
          id(states)[index] = 0;
          lightA->turn_off().perform();
          lightB->turn_off().perform();

